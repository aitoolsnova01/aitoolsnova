name: Web Story Auto-Publish

on:
  schedule:
    - cron: '30 15 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-webstory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Generate today's web story
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/generate-webstory.mjs

      - name: Commit and push new web story
        run: |
          git config user.name "AIToolsNova Bot"
          git config user.email "bot@aitoolsnova.com"
          git add web-stories/ web-stories.html sitemap.xml || true
