name: Google Indexing - Submit All

# Rozana saare sitemap URLs Google Indexing API ko bhejta hai.
# Chalne ke liye repo secret GOOGLE_SERVICE_ACCOUNT_JSON zaroori hai
# (dekho GOOGLE_INDEXING_SETUP.md). Secret na ho to job skip ho jayegi.
on:
  schedule:
    - cron: '30 5 * * *'   # rozana 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 🔎 Submit all URLs to Google
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON secret not set - skipping."
            exit 0
          fi
          node scripts/google-index-all.mjs
