name: Deploy to Cloudflare Pages

# REQUIRED GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  (Account → Cloudflare Pages → Edit)
#   CLOUDFLARE_ACCOUNT_ID
# OPTIONAL:
#   CF_PAGES_PROJECT (default: aitoolsnova)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in repo Secrets"
            echo "Add them at: GitHub → Settings → Secrets → Actions"
            echo "OR deploy manually: Cloudflare → Workers & Pages → Deployments → Retry deployment"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          PROJECT_NAME="${PROJECT:-aitoolsnova}"
          npm install -g wrangler@3
          npx wrangler pages deploy . \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
