name: Deploy to Cloudflare Pages

# REQUIRED GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  (Account → Cloudflare Pages → Edit)
#   CLOUDFLARE_ACCOUNT_ID
# OPTIONAL:
#   CF_PAGES_PROJECT (default: aitoolsnova)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # This workflow is a manual backup. Cloudflare Pages already deploys
          # every push through its own Git integration, so missing secrets are
          # not an error - they just mean this optional path is not configured.
          # Failing here produced a red X on every single push and buried the
          # real failures (the daily blog job) in the run list.
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Wrangler secrets not set - skipping. Cloudflare Pages Git integration handles deploys."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '22'

      - name: Deploy with Wrangler
        if: steps.check.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          PROJECT_NAME="${PROJECT:-aitoolsnova}"
          npm install -g wrangler@3
          npx wrangler pages deploy . \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
