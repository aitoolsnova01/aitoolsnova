name: CF Auto-Fix

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  cf-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_TOKEN: cfut_3fUw28MRXNq9yxXCZFLo7pqEjHa7n9b210587
      FIX: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Run Cloudflare diagnose and fix
        run: bash scripts/cf-fix.sh

      - name: Post report to issue 2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT=$(cat cf-report.md 2>/dev/null || true)
          if [ -n "$REPORT" ]; then
            {
              echo "**CF Auto-Fix run** (${{ github.run_number }}) -- ${{ github.ref_name }}"
              echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              echo "---"
              echo ""
              echo "$REPORT"
            } > /tmp/body.txt
            gh issue comment 2 --repo "${{ github.repository }}" --body-file /tmp/body.txt || true
          fi
